# Gates 1 and 2 on every pull request — the two that need no screen, no permission and no
# person (`CONTRIBUTING.md`, "The four gates"). Gates 3 and 5 capture a real screen and run the
# app; they stay on a contributor's Mac, and a pull request says what they printed.
#
# NOT YET OBSERVED RUNNING. Written 2026-10-22 without a GitHub run to read. Two things may need
# changing on its first run, and both fail loudly rather than passing by accident:
#   - the runner needs an Xcode that ships Swift 6.4 and the macOS 27 SDK;
#   - the renderer's tests record "no Metal render device" as a FAILURE, not a skip, by design —
#     if the hosted runner has no Metal device, those tests are the ones that say so.
name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Which toolchain
        # Printed first, so a failure below is read against the compiler that produced it.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
          sw_vers

      - name: Gate 1 — the package's tests
        run: swift test --package-path Core --no-parallel

      - name: Gate 2 — strict memory safety
        run: ./scripts/check-strict-memory-safety.sh
